# 测试环境关闭 Spring Cloud Bootstrap 外部配置加载，避免请求层测试依赖真实 Nacos。
spring:
  # Spring Cloud 测试配置。
  cloud:
    # Bootstrap 测试配置。
    bootstrap:
      # 关闭测试阶段的 bootstrap 远程配置流程。
      enabled: false
    # Nacos 测试配置。
    nacos:
      # Nacos 配置中心测试配置。
      config:
        # 关闭测试阶段的 Nacos 配置中心连接。
        enabled: false
      # Nacos 注册中心测试配置。
      discovery:
        # 关闭测试阶段的 Nacos 注册中心连接。
        enabled: false
